name: Test GitHub
on: [push]
jobs:
    Deploy_VMs:
        name: Deploying VMs
        runs-on: self-hosted
        container: 
          image: "ubuntu:24.04"
        steps:
          - name: Install requierements
            run: apt update && apt install -y unzip ca-certificates
        
          - name: Setup node
            uses: actions/setup-node@v4
            with:
              node-version: 22
              
          - name: Checkout repository
            uses: actions/checkout@v4

          - name: Setup Terraform
            uses: hashicorp/setup-terraform@v3
            with:
              terraform_version: "1.11.1"

          - name: Authenticate to Google Cloud
            working-directory: ./terraform
            run: |
              echo '${{ secrets.GCP_CONNECTION_FILE }}' > ./gcloud-key.json
      
          - name: init terraform
            working-directory: ./terraform
            run:  terraform init
            env: 
              GOOGLE_APPLICATION_CREDENTIALS: './gcloud-key.json'
          
          - name: Apply terraform
            working-directory: ./terraform
            run:  terraform apply -auto-approve
            env: 
              TF_VAR_gcp_bucket_name: ${{vars.GPC_BUCKET_NAME}}
              TF_VAR_terraform_private_key: ${{secrets.TERRAFORM_PRIVATE_KEY}}
              TF_VAR_proxmox_api_token: ${{secrets.PROXMOX_API_TOKEN}}
              TF_VAR_proxmox_ip: ${{secrets.PROXMOX_IP}}
              TF_VAR_proxmox_port: ${{secrets.PROXMOX_PORT}}
              TF_VAR_debian_url: ${{vars.DEBIAN_URL}}
              TF_VAR_debian_sha512: ${{vars.DEBIAN_SHA512}}
              TF_VAR_terraform_allowed_key_public: ${{secrets.TERRAFORM_ALLOWED_KEY_PUBLIC}}
              GOOGLE_APPLICATION_CREDENTIALS: "./gcloud-key.json"
              TF_VAR_k8s_cluster_network_prefix: ${{secrets.K8S_CLUSTER_NETWORK_PREFIX}}
          
          - name: Keep container running on failure
            if: failure()
            run: sleep infinity

    Install_k3s:
      name: Deploying K3S cluster
      runs-on: self-hosted
      needs: [Deploy_VMs]
      container: 
        image: "ubuntu:24.04"
      
      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Installing ansible and dependencies
          run: apt update && apt install -y pipx python3-requests ssh && pipx install --include-deps --force ansible && pipx inject ansible requests 
        
        - name: Update PATH
          run: echo "/github/home/.local/bin" >> $GITHUB_PATH
  
        
        - name: Set private Key file
          working-directory: ./ansible
          run: |
            echo '${{secrets.TERRAFORM_ALLOWED_KEY_PRIVATE}}' > ansible_private_key && chmod 700 ansible_private_key
        
        - name: Install cluster
          working-directory: ./ansible
          run: ansible-playbook install_cluster.yaml -e k3s_proxy_server="${{secrets.K3S_PROXY_IP}}"
          env:
            proxmox_api_token: ${{secrets.PROXMOX_API_TOKEN}}
        
        - name: Saving KUBECONFIG
          uses: actions/upload-artifact@v4
          with:
            name: KUBECONFIG
            path: ~/k3s.yaml
            if-no-files-found: error
            retention-days: 1
            overwrite: true

        - name: Keep container running on failure
          if: failure()
          run: sleep infinity
    
    Install_cert_manager:
      name: Installing cert-manager
      runs-on: self-hosted
      needs: [Install_k3s]
      container: 
        image: "ubuntu:24.04"
      steps:
        - name: Checkout repository
          uses: actions/checkout@v4
        
        - name: Installing kubectl
          uses: azure/setup-kubectl@v4
          with:
            version: 'latest'

        - name: Retreive KUBECONFIG
          uses: actions/download-artifact@v4
          with:
            name: KUBECONFIG
            path: ~/

        - name: Setting kubeconfig file
          run: |
            mv ~/k3s.yaml ~/.kube/config
            sed -i 's/127.0.0.1/${{ secrets.K3S_PROXY_IP }}/g' ~/.kube/config

        - name: Installaging requirements
          run: |
            apt update
            apt install -y git make curl docker.io

        - name: Installing cert-manager
          run: |
            curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
            chmod 700 get_helm.sh
            ./get_helm.sh
            helm repo add jetstack https://charts.jetstack.io
            helm repo update
            if [ ! $(helm list -n cert-manager | grep "deployed") ]; then
              helm install \
              cert-manager jetstack/cert-manager \
              --namespace cert-manager \
              --create-namespace \
              --set installCRDs=true
            fi
        
        - name: Creating certificates and ingress
          working-directory: ./k8s
          run: |
            kubectl apply -f certificates.yaml
            kubectl apply -f ingress.yaml

        - name: Installing cert-manager-webhook-duckdns
          run: |
            if [ ! $(helm list -n cert-manager | grep cert-manager-webhook-duckdns |grep deployed) ]; then
              git clone https://github.com/ebrianne/cert-manager-webhook-duckdns.git
              cd ./cert-manager-webhook-duckdns
              make build
              helm install cert-manager-webhook-duckdns \
              --namespace cert-manager \
              --set duckdns.token='${{ secrets.DUCKDNS_TOKEN }}' \
              --set clusterIssuer.production.create=true \
              --set clusterIssuer.staging.create=true \
              --set clusterIssuer.email=${{ vars.DUCKDNS_EMAIL }} \
              --set logLevel=2 \
              ./deploy/cert-manager-webhook-duckdns
            fi
        - name: Keep container running on failure
          if: failure()
          run: sleep infinity



    Install_Trilium:
      name: Deploying Trilium
      runs-on: self-hosted
      needs: [Install_k3s]
      container: 
        image: "ubuntu:24.04"
      steps:
        - name: Checkout repository
          uses: actions/checkout@v4
        
        - name: Installing kubectl
          uses: azure/setup-kubectl@v4
          with:
            version: 'latest'
        
        - name: Retreive KUBECONFIG
          uses: actions/download-artifact@v4
          with:
            name: KUBECONFIG
            path: ~/
  
        - name: Setting kubeconfig file
          run: |
            mv ~/k3s.yaml ~/.kube/config
            sed -i 's/127.0.0.1/${{ secrets.K3S_PROXY_IP }}/g' ~/.kube/config
        - name: Deploy volumes
          working-directory: ./k8s/volumes
          run: |
            kubectl apply -f trilium-pv.yaml
            kubectl apply -f trilium-pvc.yaml
        
        - name: Deploy app
          working-directory: ./k8s/apps
          run: |
            kubectl apply -f trilium.yaml
        
        - name: Deploy app
          working-directory: ./k8s/network
          run: |
            kubectl apply -f trilium-service.yaml
        - name: Keep container running on failure
          if: failure()
          run: sleep infinity

    


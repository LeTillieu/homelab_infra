---
# tasks file for roles/create_postgresql_users
- name: Installing postgres
  become: true
  ansible.builtin.package:
    name: postgresql
    state: present

- name: Installing python3-psycopg2
  become: true
  ansible.builtin.package:
    name: python3-psycopg2
    state: present

- name: Creating database
  community.postgresql.postgresql_db:
    name: "postgres"
    encoding: 'UTF8'
    state: present

- name: Creating schemas
  loop: "{{ schemes }}"
  community.postgresql.postgresql_schema:
    database: "postgres"
    name: "{{ item.name }}"
    state: present

- name: Creating users
  loop: "{{ schemes }}"
  community.postgresql.postgresql_user:
    db: "postgres"
    role: "{{ item.username }}"
    password: "{{ item.username }}"
    state: present

- name: Setting user's privileges
  loop: "{{ schemes }}"
  community.postgresql.postgresql_privs:
    database: "postgres"
    role: "{{ item.username }}"
    type: "schema"
    privs: "ALL"
    objs: "{{ item.name }}"
    state: present


---

- name: Installing Sealed Secrets
  hosts: "{{ groups['k8s_controlplane'][0] }}"
  become: true
  vars:
    ansible_python_interpreter: /opt/ansible_venv/bin/python3
  tasks:
    - name:  Installing git
      become: true
      ansible.builtin.package:
        name: git
        state: present
        
    - name: Install helm-diff
      kubernetes.core.helm_plugin:
        plugin_path: https://github.com/databus23/helm-diff
        state: present
    
    - name: Adding sealed-secrets repo
      kubernetes.core.helm_repository:
        name: sealed-secrets
        repo_url: https://bitnami-labs.github.io/sealed-secrets

    - name: Installing sealed-secrets
      kubernetes.core.helm:
        name: sealed-secrets
        chart_ref: sealed-secrets/sealed-secrets
        release_namespace: kube-system
        create_namespace: true
        release_state: present
        wait: true
        timeout: "5m"
    
    - name: Copy sealedsecret_private.key
      ansible.builtin.copy:
        src: ./sealedssealed-secrets-key.yaml
        dest: sealed-secrets-key.yaml
    
    - name: Importing private kube-system
      ansible.builtin.command:
        cmd: kubectl apply -f sealed-secrets-key.yaml
    
    - name: Delete previous  pod
      ansible.builtin.command:
        cmd: kubectl delete pod -n kube-system -l app.kubernetes.io/name=sealed-secrets


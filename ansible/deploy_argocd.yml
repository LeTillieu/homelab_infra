---

- name: Deploying ArgoCD
  hosts: "{{ groups['k8s_controlplane'][0] }}"
  become: true
  vars:
    ansible_python_interpreter: /opt/ansible_venv/bin/python3
  tasks:
    - name: Installing git
      become: true
      ansible.builtin.package:
        name: git
        state: present

    - name: Install helm-diff
      kubernetes.core.helm_plugin:
        plugin_path: https://github.com/databus23/helm-diff
        state: present
  
    - name: Creating argocd namespace
      kubernetes.core.k8s:
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: argocd

    - name: Downloading argocd manifests
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
        dest: /tmp/argocd.yaml
  
    - name: Installing argocd
      kubernetes.core.k8s:
        state: present
        src: /tmp/argocd.yaml
        namespace: argocd
    
    - name: Argocd disable TLS
      kubernetes.core.k8s:
        state: patched
        kind: Deployment
        name: argocd-server
        namespace: argocd
        definition:
          spec:
            template:
              spec:
                containers:
                  - name: argocd-server
                    args:
                      - /usr/local/bin/argocd-server
                      - --insecure
      
    - name: Argocd create certificate
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: cert-manager.io/v1
          kind: Certificate
          metadata:
            name: ssl-certificate
            namespace: argocd
          spec:
            dnsNames:
            - 'argo.ltillieu.duckdns.org'
            issuerRef:
              name: cert-manager-webhook-duckdns-production
              kind: ClusterIssuer
            secretName: argocd-ssl-certificate
    
    - name: Argocd create ingress
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: argocd-server-http-ingress
            namespace: argocd
          spec:
            ingressClassName: nginx
            rules:
            - http:
                paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: argocd-server
                      port:
                        number: 80
              host: argo.ltillieu.duckdns.org
            tls:
            - hosts:
              - argo.ltillieu.duckdns.org
              secretName: argocd-ssl-certificate
    
    - name: copy argocd config files
      ansible.builtin.copy:
        src: ./files/argocd/
        dest: /tmp/argocd_config_files/
  
    - name: Deploy yamls to argocd
      kubernetes.core.k8s:
        state: present
        src: "/tmp/argocd_config_files/{{ item }}"
      loop:
        - repo.yaml
        - n8n.yaml
        - argocd_users.yaml
        - argocd_roles.yaml

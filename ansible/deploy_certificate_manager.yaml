---

- name: Installing k3s
  hosts: k3s
  tasks:
    - name: Downloading k3s install script
      ansible.builtin.include_role:
        name: install_helm
    - name: Adding jetstack repo
      community.kubernetes.helm_repository:
        name: jetstack
        repo_url: https://charts.jetstack.io

    - name: Creating cert-manager namespace
      community.kubernetes.k8s:
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: cert-manager

    - name: Installing cert-manager
      community.kubernetes.helm:
        name: cert-manager
        chart_ref: jetstack/cert-manager
        release_namespace: cert-manager
        create_namespace: true
        set_values:
          installCRDs: true
        state: present
        wait: true
        timeout: 300
    
    - name:  Installing git
      ansible.builtin.package:
        name: git
        state: present

    - name:  Installing make
      ansible.builtin.package:
        name: make
        state: present
    
    - name:  Installing curl
      ansible.builtin.package:
        name: curl
        state: present
    
    - name: Cloning cert-manager-webhook-duckdns repo
      ansible.builtin.git:
        repo: https://github.com/ebrianne/cert-manager-webhook-duckdns.git
        dest: /tmp/cert-manager-webhook-duckdns
        force: yes
    
    - name: Building cert-manager-webhook-duckdns
      ansible.builtin.make:
        chdir: /tmp/cert-manager-webhook-duckdns
        target: build
    
    - name: Installing cert-manager-webhook-duckdns
      community.kubernetes.helm:
        name: cert-manager-webhook-duckdns
        chart_ref: /tmp/cert-manager-webhook-duckdns/deploy/cert-manager-webhook-duckdns
        release_namespace: cert-manager
        create_namespace: true
        state: present
        wait: true
        timeout: 300
        set_values:
          duckdns.token: "{{ duckdns_token }}"
          clusterIssuer.production.create: true
          clusterIssuer.staging.create: true
          clusterIssuer.email: "{{ duckdns_email }}"
          logLevel: 2


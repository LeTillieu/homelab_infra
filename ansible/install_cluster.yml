---
- name: Install requierements on all vm
  hosts: k8s
  become: true
  tasks:
    - name: Install required packages
      ansible.builtin.package:
        state: present
        name: "{{ item }}"
      loop:
        - apt-transport-https
        - ca-certificates
        - curl
        - gnupg
        - lsb-release
        - software-properties-common
    - name: Disable swap for current session
      ansible.builtin.shell:
        cmd: swapoff -a
    - name: Disable swap for next sessions
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: ^(\s*)([^#\n]+\s+)(\w+\s+)swap(\s+.*)$'
        replace: '#\1\2\3swap\4'
    - name: Load required kernel modules
      community.general.modprobe:
        name: "{{ item }}"
        persistent: present
        state: present
      loop:
        - overlay
        - br_netfilter
    - name: Set network parameters
      ansible.posix.sysctl:
        state: present
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        sysctl_file: /etc/sysctl.d/kubernetes.conf
        reload: true
      loop:
        - { name: 'net.bridge.bridge-nf-call-ip6tables', value: 1 }
        - { name: 'net.bridge.bridge-nf-call-iptables',  value: 1 }
        - { name: 'net.ipv4.ip_forward',                 value: 1 }
    - name: Install containerd
      ansible.builtin.package:
        state: present
        name: containerd
    - name: create containerd config directory
      ansible.builtin.file:
        path: /etc/containerd
        state: directory
    - name: Copy containerd config file
      ansible.builtin.copy:
        src: ./files/containerd.toml
        dest: /etc/containerd/config.toml
    - name: restart containerd service
      ansible.builtin.systemd_service:
        name: containerd
        state: restarted
        enabled: true
    - name: Download kubernetes gpg key
      ansible.builtin.get_url:
        url: https://packages.cloud.google.com/apt/doc/apt-key.gpg
        dest: /usr/share/keyrings/kubernetes-archive-keyring.gpg
    - name: Add kubernetes repo
      ansible.builtin.lineinfile:
        path: /etc/apt/sources.list.d/kubernetes.list
        line: "deb [signed-by=/usr/share/keyrings/kubernetes-archive-keyring.gpg] https://apt.kubernetes.io/ kubernetes-xenial main"  
        create: true
    - name: Refresh repos
      ansible.builtin.apt:
        update_cache: true
    - name: Install kubernetes packages
      ansible.builtin.package:
        name: "{{ item }}"
        state: present
      loop:
        - kubelet
        - kubeadm
        - kubectl
    
    
- name: Init cluster
  hosts: "{{ groups['k8s_controlplane'][0] }}"
  become: true
  tasks:
    - name: Check if a cluster is already installed
      ansible.builtin.stat:
        path: /etc/kubernetes/admin.conf
      register: cluster_exists
    - name: Init cluster
      when: not cluster_exists.stat.exists
      ansible.builtin.command:
        cmd: "kubeadm init --control-plane-endpoint {{ k8s_loadbalancer_ip }} --pod-network-cidr=10.244.0.0/16"
    - name: Get join cluster command
      ansible.builtin.command:
        cmd: "kubeadm token create --print-join-command"
      register: join_cluster_command
    - name: Get cluster certificates
      ansible.builtin.command:
        cmd: "kubeadm init phase upload-certs --upload-certs"
      register: join_cluster_certificate
    
    - name: Fails if cant get join command
      ansible.builtin.fail:
        msg: "Impossible to retreive command to join the cluster"
      when: join_cluster_command.rc != 0
    - name: Fails if cant get join command
      ansible.builtin.fail:
        msg: "Impossible to retreive certificates to join the cluster"
      when: join_cluster_certificate.rc != 0

- name: Join controlplanes to cluster
  hosts: "{{ groups['k8s_controlplane'][1:] }}"
  become: true
  tasks:
    - name: Join controlplane
      ansible.builtin.command:
        cmd: "{{ hostvars[groups[''k8s_controlplane''][0]]['join_cluster_command'].stdout }} --ignore-preflight-errors=NumCPU --control-plane --certificate-key {{ hostvars[groups[''k8s_controlplane''][0]]['join_cluster_certificate'].stdout_lines[-1] }}" 

- name: Join worker nodes to cluster
  hosts: "{{ groups['k8s_node'] }}"
  become: true
  tasks:
    - name: Join worker
      ansible.builtin.command:
        cmd: "{{ hostvars[groups[''k8s_controlplane''][0]]['join_cluster_command'].stdout }} --ignore-preflight-errors=NumCPU" 


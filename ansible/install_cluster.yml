---
- name: Install requierements on all vm
  hosts: k8s
  become: true
  tasks:
    - name: Set hostname
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"
        use: debian
    - name: Refresh repos
      ansible.builtin.apt:
        update_cache: true
    - name: Install required packages
      ansible.builtin.package:
        state: present
        name: "{{ item }}"
      loop:
        - apt-transport-https
        - ca-certificates
        - curl
        - gnupg
        - lsb-release
        - gpg
        - sudo
        - open-iscsi
    - name: Start and enable iscsid
      ansible.builtin.systemd:
        name: iscsid
        state: started
        enabled: true
    - name: Disable swap for current session
      ansible.builtin.shell:
        cmd: swapoff -a
    - name: Disable swap for next sessions
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: ^(\s*)([^#\n]+\s+)(\w+\s+)swap(\s+.*)$'
        replace: '#\1\2\3swap\4'
    - name: Load required kernel modules
      community.general.modprobe:
        name: "{{ item }}"
        persistent: present
        state: present
      loop:
        - overlay
        - br_netfilter
    - name: Set network parameters
      ansible.posix.sysctl:
        state: present
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        sysctl_file: /etc/sysctl.d/kubernetes.conf
        reload: true
      loop:
        - { name: 'net.bridge.bridge-nf-call-ip6tables', value: 1 }
        - { name: 'net.bridge.bridge-nf-call-iptables',  value: 1 }
        - { name: 'net.ipv4.ip_forward',                 value: 1 }
    - name: Install containerd
      ansible.builtin.package:
        state: present
        name: containerd
    - name: create containerd config directory
      ansible.builtin.file:
        path: /etc/containerd
        state: directory
    - name: Copy containerd config file
      ansible.builtin.copy:
        src: ./files/containerd.toml
        dest: /etc/containerd/config.toml
    - name: restart containerd service
      ansible.builtin.systemd_service:
        name: containerd
        state: restarted
        enabled: true
    - name: delete gpg key
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/keyrings/kubernetes-apt-keyring.gpg
        - /etc/apt/trusted.gpg.d/debian.griffo.io.gpg
    - name: Add gpg keys
      ansible.builtin.shell:
        cmd: "curl -fsSL {{ item.url }} | sudo gpg --dearmor -o {{ item.path }}"
      loop:
        - {"url": "https://pkgs.k8s.io/core:/stable:/v1.34/deb/Release.key", "path": "/etc/apt/keyrings/kubernetes-apt-keyring.gpg"}
        - {"url": "https://debian.griffo.io/EA0F721D231FDD3A0A17B9AC7808B4DD62C41256.asc", "path": "/etc/apt/trusted.gpg.d/debian.griffo.io.gpg"}

    - name: Add repos
      ansible.builtin.lineinfile:
        path: "{{ item.path }}"
        line: "{{ item.line }}"  
        create: true
      loop:
        - {'line': 'deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.34/deb/ /', 'path': '/etc/apt/sources.list.d/kubernetes.list'}
        - {'line': "deb https://debian.griffo.io/apt {{ ansible_distribution_release }} main", 'path': '/etc/apt/sources.list.d/debian.griffo.io.list'}
    - name: Refresh repos
      ansible.builtin.apt:
        update_cache: true
    - name: Install kubernetes packages
      ansible.builtin.package:
        name: "{{ item }}"
        state: present
      loop:
        - kubelet
        - kubeadm
        - kubectl
    - name: Install ghostty
      ansible.builtin.package:
        name: "ghostty"
        state: present
    
  
    
- name: Init cluster
  hosts: "{{ groups['k8s_controlplane'][0] }}"
  become: true
  tasks:
    - name: Check if a cluster is already installed
      ansible.builtin.stat:
        path: /etc/kubernetes/admin.conf
      register: cluster_exists
    - name: Init cluster
      when: not cluster_exists.stat.exists
      ansible.builtin.command:
        cmd: "kubeadm init --control-plane-endpoint {{ k8s_loadbalancer_ip }} --pod-network-cidr=10.244.0.0/16 --ignore-preflight-errors=NumCPU"
    - name: Create .kube directory
      ansible.builtin.file:
        path: /root/.kube/
        state: directory
    - name: Copy kubernetes config file
      ansible.builtin.copy:
        remote_src: true
        src: /etc/kubernetes/admin.conf
        dest: /root/.kube/config
    - name: Get join cluster command
      ansible.builtin.command:
        cmd: "kubeadm token create --print-join-command"
      register: join_cluster_command
    - name: Get cluster certificates
      ansible.builtin.command:
        cmd: "kubeadm init phase upload-certs --upload-certs"
      register: join_cluster_certificate
    
    - name: Fails if cant get join command
      ansible.builtin.fail:
        msg: "Impossible to retreive command to join the cluster"
      when: join_cluster_command.rc != 0
    - name: Fails if cant get join command
      ansible.builtin.fail:
        msg: "Impossible to retreive certificates to join the cluster"
      when: join_cluster_certificate.rc != 0

- name: Join controlplanes to cluster
  hosts: "{{ groups['k8s_controlplane'][1:] }}"
  become: true
  tasks:
    - name: Check if a cluster is already installed
      ansible.builtin.stat:
        path: /etc/kubernetes/admin.conf
      register: cluster_exists
    - name: Join controlplane
      when: not cluster_exists.stat.exists
      ansible.builtin.command:
        cmd: "{{ hostvars[groups['k8s_controlplane'][0]]['join_cluster_command'].stdout }} --ignore-preflight-errors=NumCPU --control-plane --certificate-key {{ hostvars[groups['k8s_controlplane'][0]]['join_cluster_certificate'].stdout_lines[-1] }}" 
    - name: Create .kube directory
      ansible.builtin.file:
        path: /root/.kube/
        state: directory
    - name: Copy kubernetes config file
      ansible.builtin.copy:
        remote_src: true
        src: /etc/kubernetes/admin.conf
        dest: /root/.kube/config

- name: Join worker nodes to cluster
  hosts: "{{ groups['k8s_node'] }}"
  become: true
  tasks:
    - name: Check if a cluster is already installed
      ansible.builtin.stat:
        path: /etc/kubernetes/kubelet.conf
      register: cluster_exists
    - name: Join worker
      when: not cluster_exists.stat.exists
      ansible.builtin.command:
        cmd: "{{ hostvars[groups['k8s_controlplane'][0]]['join_cluster_command'].stdout }} --ignore-preflight-errors=NumCPU" 

- name: Install helm on controlplane
  hosts: "{{ groups['k8s_controlplane'] }}"
  become: true
  tasks:
    - name: Remove helm gpg key
      ansible.builtin.file:
        path: /usr/share/keyrings/helm.gpg
        state: absent
    - name: Set helm gpg key
      ansible.builtin.shell:
        cmd: 'curl -fsSL https://packages.buildkite.com/helm-linux/helm-debian/gpgkey | gpg --dearmor -o /usr/share/keyrings/helm.gpg '
    - name: Add helm repo
      ansible.builtin.lineinfile:
        path: /etc/apt/sources.list.d/helm-stable-debian.list
        line: "deb [signed-by=/usr/share/keyrings/helm.gpg] https://packages.buildkite.com/helm-linux/helm-debian/any/ any main"  
        create: true 
    - name: Refresh repos
      ansible.builtin.apt:
        update_cache: true
    - name: Install helm packages
      ansible.builtin.package:
        name: "helm"
        state: present

- name: Configure controlplanes to work with kubernetes modules
  hosts: "{{ groups['k8s_controlplane'] }}"
  become: true
  tasks:
    - name: Install dependencies
      ansible.builtin.package:
        name: python3-venv
    - name: Create python venv
      ansible.builtin.command:
        cmd: python3 -m venv /opt/ansible_venv
        creates: /opt/ansible_venv/bin/activate
    - name: Install pip modules
      ansible.builtin.pip:
        state: present
        name: "{{ item }}"
        virtualenv: "/opt/ansible_venv"
      loop:
        - kubernetes
        - jsonpatch
        - pyyaml


- name: Configure all nodes
  hosts: k8s
  become: true
  tasks:
    - name: Enable serverTLSBootstrap in kubeconfig
      ansible.builtin.lineinfile:
        path: /var/lib/kubelet/config.yaml
        regexp: '^\s*serverTLSBootstrap\s*:'
        line: 'serverTLSBootstrap: true'
        state: present
    - name: Restart kubelet
      ansible.builtin.service:
        name: kubelet
        state: restarted

- name: Sign CSR
  hosts: "{{ groups['k8s_controlplane'][0] }}"
  become: true
  vars:
    ansible_python_interpreter: /opt/ansible_venv/bin/python3
  tasks:
    - name: Retreive all csr
      kubernetes.core.k8s_info:
        api_version: certificates.k8s.io/v1
        kind: CertificateSigningRequest
      register: csr_info
    - name: Filtrer les to keep only pending csr
      ansible.builtin.set_fact:
        pending_csrs: >-
          {{ csr_info.resources
             | selectattr('status.conditions', 'undefined')
             | map(attribute='metadata.name')
             | list }}

    - name: Afficher la liste des CSR en attente
      debug:
        msg: "CSRs en attente : {{ pending_csrs | join(', ') if pending_csrs else 'Aucune CSR en attente' }}"
    - name: Approved pending CSR
      when: pending_csrs | length > 0
      loop: "{{ pending_csrs }}"
      ansible.builtin.command:
        cmd: "kubectl certificate approve {{ item }}"

- name: Install required manifests
  hosts: "{{ groups['k8s_controlplane'][0] }}"
  become: true
  vars:
    ansible_python_interpreter: /opt/ansible_venv/bin/python3
  tasks:
    - name: Configure cluster for metallb
      ansible.builtin.command:
        cmd: |
          kubectl get configmap kube-proxy -n kube-system -o yaml | \
          sed -e "s/strictARP: false/strictARP: true/" | \
          kubectl apply -f - -n kube-system

    - name: Download manifests
      ansible.builtin.get_url:
        url: "{{ item.url }}"
        dest: "{{ item.path }}"
      loop:
        - {"url": "https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml", "path": "/tmp/kube-flannel.yml"}
        - {"url": "https://raw.githubusercontent.com/longhorn/longhorn/v1.10.0/deploy/longhorn.yaml", "path": "/tmp/longhorn.yaml"}
        - {"url": "https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml", "path": "/tmp/metrics-server.yaml"}
        - {"url": "https://raw.githubusercontent.com/metallb/metallb/v0.15.3/config/manifests/", "path": "/tmp/metallb.yaml"}

    - name: Apply manifests
      kubernetes.core.k8s:
        src: "{{ item }}"
        state: present
      loop:
        - /tmp/kube-flannel.yml
        - /tmp/longhorn.yaml
        - /tmp/metrics-server.yaml
        - /tmp/metallb.yaml
    - name: copy longhorn service manifests
      ansible.builtin.copy:
        src: ./files/longhorn-service.yaml
        dest: /tmp/longhorn-service.yaml
    - name: Apply longhorn service manifests
      kubernetes.core.k8s:
        src: /tmp/longhorn-service.yaml
        state: present
    - name: Install nginx ingress
      kubernetes.core.helm:
        release_name: ingress-nginx
        release_namespace: ingress-nginx
        chart_ref: ingress-nginx
        create_namespace: true
        chart_repo_url: https://kubernetes.github.io/ingress-nginx
    - name: copy metallb manifests
      ansible.builtin.copy:
        src: ./files/metallb.yaml
        dest: /tmp/metallb.yaml
    - name: Apply metallb manifests
      kubernetes.core.k8s:
        src: /tmp/metallb.yaml
        state: present
    
        


